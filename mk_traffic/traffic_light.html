<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유아용 신호등 놀이</title>
    <style>
        :root {
            --red-on: #ff3b30;
            --red-off: #4d0f0c;
            --green-on: #34c759;
            --green-off: #0f3d1b;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* 신호등 영역 */
        .traffic-light-container {
            width: 100vw;
            max-width: 450px;
            background-color: #333;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border-bottom: 5px solid #222;
        }

        .light-box {
            width: 160px;
            height: 160px;
            background-color: #222;
            border-radius: 20px;
            border: 5px solid #444;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        /* 보행자 아이콘 (SVG) */
        .walk-svg {
            width: 90px;
            height: 90px;
            fill: #444;
            transition: fill 0.2s, filter 0.2s;
        }

        /* 신호등 상태별 불빛 및 아이콘 색상 */
        .light-box.red-light { background-color: var(--red-off); }
        .light-box.red-light.active { 
            background-color: var(--red-on); 
            box-shadow: 0 0 30px var(--red-on);
        }
        .light-box.red-light.active .walk-svg { 
            fill: var(--red-on); 
            filter: drop-shadow(0 0 8px var(--red-on));
        }

        .light-box.green-light { background-color: var(--green-off); }
        .light-box.green-light.active { 
            background-color: var(--green-on); 
            box-shadow: 0 0 30px var(--green-on);
        }
        .light-box.green-light.active .walk-svg { 
            fill: var(--green-on); 
            filter: drop-shadow(0 0 8px var(--green-on));
        }

        /* 깜빡임 애니메이션 */
        @keyframes blink {
            0%, 49% { background-color: var(--green-on); }
            50%, 100% { background-color: var(--green-off); }
        }
        @keyframes blink-svg {
            0%, 49% { fill: var(--green-on); filter: drop-shadow(0 0 8px var(--green-on)); }
            50%, 100% { fill: #444; filter: none; }
        }
        .light-box.green-light.blinking {
            animation: blink 0.5s infinite;
        }
        .light-box.green-light.blinking .walk-svg {
            animation: blink-svg 0.5s infinite;
        }

        /* 타이머 숫자 표시 */
        .timer-display {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            background: #000;
            padding: 5px 15px;
            border-radius: 10px;
            min-width: 40px;
            text-align: center;
        }

        /* 제어판 영역 */
        .control-panel {
            width: 90vw;
            max-width: 400px;
            background: #2a2a2a;
            margin-top: 15px;
            padding: 15px;
            border-radius: 15px;
            color: white;
            box-sizing: border-box;
        }

        .mode-select {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
        }

        .mode-btn {
            flex: 1;
            margin: 0 5px;
            padding: 10px;
            background: #444;
            border: none;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .mode-btn.active {
            background: #007aff;
        }

        .time-settings {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
        }

        .time-input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-input-group input {
            width: 60px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #666;
            background: #444;
            color: white;
            text-align: center;
        }

        /* 하단 자동차 애니메이션 도로 영역 */
        .road-container {
            flex: 1;
            width: 100%;
            background-color: #555;
            position: relative;
            display: flex;
            align-items: center;
            border-top: 4px dashed #fff;
            border-bottom: 4px dashed #fff;
            margin-top: auto;
            overflow: hidden;
        }

        .car {
            width: 90px;
            height: 50px;
            position: absolute;
            left: -100px;
            font-size: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: left 0.1s linear;
        }
    </style>
</head>
<body>

    <!-- 신호등 상단 -->
    <div class="traffic-light-container">
        <!-- 빨간불 (서 있는 사람) -->
        <div id="redLight" class="light-box red-light active" onclick="handleLightClick('RED')">
            <svg class="walk-svg" viewBox="0 0 24 24">
                <path d="M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M10.5,22V16H8V11H16V16H13.5V22H10.5Z" />
            </svg>
        </div>
        
        <!-- 타이머 수치 표시 -->
        <div id="timerDisplay" class="timer-display">5</div>

        <!-- 초록불 (걷는 사람) -->
        <div id="greenLight" class="light-box green-light" onclick="handleLightClick('GREEN')">
            <svg class="walk-svg" viewBox="0 0 24 24">
                <path d="M13.5,5.5A1.5,1.5 0 0,1 15,7A1.5,1.5 0 0,1 13.5,8.5A1.5,1.5 0 0,1 12,7A1.5,1.5 0 0,1 13.5,5.5M9.8,22L11,17.3L13,19V22H15V17.5L13.2,15.8L13.8,12.7C14.7,13.8 16,14.5 17.5,14.5V12.5C16.2,12.5 15.2,11.7 14.7,10.7L13.8,9.2C13.5,8.7 12.9,8.4 12.3,8.4C12,8.4 11.7,8.5 11.4,8.6L7,10.5V14.5H9V11.8L10.6,11.2L9.1,18.3L5.4,17.5L5,19.5L9.8,22Z" />
            </svg>
        </div>
    </div>

    <!-- 중앙 설정 제어판 -->
    <div class="control-panel">
        <div class="mode-select">
            <button id="btnAuto" class="mode-btn active" onclick="setMode('AUTO')">자동 모드</button>
            <button id="btnManual" class="mode-btn" onclick="setMode('MANUAL')">수동 모드</button>
        </div>
        <div class="time-settings">
            <div class="time-input-group">
                <label>🔴 빨간불 유지 시간 (초):</label>
                <input type="number" id="inputRedTime" value="5" min="2" onchange="updateSettings()">
            </div>
            <div class="time-input-group">
                <label>🟢 초록불 유지 시간 (초):</label>
                <input type="number" id="inputGreenTime" value="8" min="5" onchange="updateSettings()">
            </div>
        </div>
    </div>

    <!-- 하단 도로 및 자동차 -->
    <div class="road-container">
        <div id="car" class="car">🚗</div>
    </div>

    <script>
        // 상태 관리 변수
        let currentLight = 'RED'; // 'RED' 또는 'GREEN'
        let currentMode = 'AUTO';  // 'AUTO' 또는 'MANUAL'
        let timeLeft = 5;
        let mainTimer = null;
        let carAnimation = null;

        // 설정 값
        let settings = {
            redTime: 5,
            greenTime: 8,
            blinkStart: 3 // 초록불 종료 몇 초 전부터 깜빡일지
        };

        // 오디오 컨텍스트 (한국 신호등 딩동댕동 소리 전자 합성)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playDongDang() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                
                // 첫 번째 높은 음 (딩~)
                let osc1 = audioCtx.createOscillator();
                let gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(987.77, now); // B5 음
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.4);

                // 두 번째 낮은 음 (동~)
                let osc2 = audioCtx.createOscillator();
                let gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(783.99, now + 0.25); // G5 음
                gain2.gain.setValueAtTime(0.3, now + 0.25);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.65);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.25);
                osc2.stop(now + 0.65);
            } catch(e) {
                console.log("오디오 재생 재생 불가:", e);
            }
        }

        // 초기 구동
        window.onload = function() {
            updateSettings();
            resetTimer();
            startLoop();
            initCar();
        };

        // 설정 변경 반영
        function updateSettings() {
            settings.redTime = parseInt(document.getElementById('inputRedTime').value) || 5;
            settings.greenTime = parseInt(document.getElementById('inputGreenTime').value) || 8;
            if(currentLight === 'RED' && timeLeft > settings.redTime) timeLeft = settings.redTime;
            if(currentLight === 'GREEN' && timeLeft > settings.greenTime) timeLeft = settings.greenTime;
document.getElementById('timerDisplay').innerText = timeLeft;
}
// 모드 전환 (자동/수동)
function setMode(mode) {
currentMode = mode;
document.getElementById('btnAuto').classList.toggle('active', mode === 'AUTO');
document.getElementById('btnManual').classList.toggle('active', mode === 'MANUAL');
if(mode === 'MANUAL') {
document.getElementById('timerDisplay').innerText = "-";
clearInterval(mainTimer);
} else {
resetTimer();
startLoop();
}
}
// 타이머 초기화
function resetTimer() {
timeLeft = (currentLight === 'RED') ? settings.redTime : settings.greenTime;
document.getElementById('timerDisplay').innerText = timeLeft;
}
// 메인 루프 실행 (1초 주기)
function startLoop() {
clearInterval(mainTimer);
mainTimer = setInterval(() => {
if (currentMode === 'MANUAL') return;
timeLeft--;
document.getElementById('timerDisplay').innerText = timeLeft;
// 초록불 깜빡임 효과 조건 체크
const greenLightDiv = document.getElementById('greenLight');
if (currentLight === 'GREEN' && timeLeft <= settings.blinkStart) {
greenLightDiv.classList.add('blinking');
} else {
greenLightDiv.classList.remove('blinking');
}
// 시간 종료 시 신호 전환
if (timeLeft <= 0) {
switchLight();
}
}, 1000);
}
// 신호등 직접 클릭/터치 이벤트 처리 함수
function handleLightClick(clickedLight) {
initAudio(); // 사용자 상호작용 시 오디오 컨텍스트 활성화 보장
if (currentMode === 'MANUAL') {
// 수동 모드일 때는 클릭한 불빛으로 바로 전환
if (currentLight !== clickedLight) {
currentLight = clickedLight;
renderLightUI();
}
} else {
// 자동 모드일 때는 클릭 시 남은 시간 종료 처리하여 즉시 다음 신호로 넘김
switchLight();
}
}
// 신호 상태 강제 전환
function switchLight() {
currentLight = (currentLight === 'RED') ? 'GREEN' : 'RED';
renderLightUI();
if (currentMode === 'AUTO') {
resetTimer();
}
}
// UI에 현재 신호 상태 반영
function renderLightUI() {
const redLightDiv = document.getElementById('redLight');
const greenLightDiv = document.getElementById('greenLight');
// 깜빡임 초기화
greenLightDiv.classList.remove('blinking');
if (currentLight === 'RED') {
redLightDiv.classList.add('active');
greenLightDiv.classList.remove('active');
} else {
redLightDiv.classList.remove('active');
greenLightDiv.classList.add('active');
playDongDang(); // 초록불 켜질 때 신호음 출력
}
}
// 자동차 애니메이션 로직
let carX = -100;
const carSpeed = 4; // 자동차 속도
function initCar() {
const carDiv = document.getElementById('car');
const road = document.querySelector('.road-container');
function animate() {
const stopLine = road.clientWidth / 2 - 45; // 화면 중앙 부근 정지선
if (currentLight === 'RED') {
// 빨간불일 때
if (carX < stopLine - 5 || carX > stopLine + 20) {
// 정지선에 도달하지 않았거나 이미 지나친 차량은 계속 달림
carX += carSpeed;
} else if (carX >= stopLine - 5 && carX <= stopLine) {
// 정지선 근처에 오면 멈춤
carX = stopLine;
}
} else {
// 초록불일 때는 멈춤 없이 전진
carX += carSpeed;
}
// 화면 오른쪽 밖으로 완전히 나가면 왼쪽에서 다시 리스폰
if (carX > road.clientWidth) {
carX = -100;
// 리스폰 될 때 무작위 이모지 차량으로 변형 가능
const carEmojis = ['🚗', '🚑', '🚌', '🚒', '🚕', '🚚'];
carDiv.innerText = carEmojis[Math.floor(Math.random() * carEmojis.length)];
}
carDiv.style.left = carX + 'px';
carAnimation = requestAnimationFrame(animate);
}
if(carAnimation) cancelAnimationFrame(carAnimation);
animate();
}

### 🛠️ 주요 수정 사항 (에러 해결 및 개선)
1. **`touchSignal` 정의 에러 해결**: 이전 누락되었던 터치 이벤트를 PC 클릭 환경에서도 완벽히 통합하기 위해 `handleLightClick('RED')` 및 `handleLightClick('GREEN')` 함수로 전면 교체 및 정비했습니다.
2. **PC/모바일 하이브리드 지원**: 모바일 터치는 물론, PC 브라우저에서의 마우스 `onclick` 환경을 완벽하게 동시 지원합니다.
3. **자동/수동 전환 인터랙션 수정**: 
   * **자동 모드**일 때 신호등을 클릭하면 대기할 필요 없이 **즉시 다음 신호**로 넘어갑니다.
   * **수동 모드**일 때는 타이머가 꺼지며, **클릭한 신호등의 불빛으로 즉시** 바뀝니다.
