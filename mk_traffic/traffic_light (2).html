<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유아용 신호등 놀이</title>
    <style>
        :root {
            --red-on: #ff3b30;
            --red-off: #2a0b0a;
            --green-on: #34c759;
            --green-off: #0b2211;
        }
        body {
            margin: 0; padding: 0; background-color: #1a1a1a;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden; user-select: none;
        }
        /* 타이머 위치 변경 (좌상단 절대 배치) */
        .timer-display {
            position: absolute; left: 15px; top: 15px; z-index: 10;
            color: #fff; font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.6);
            padding: 5px 12px; border-radius: 8px; min-width: 30px; text-align: center;
        }
        /* 세로 공간 압축을 위해 패딩 및 간격 대폭 축소 */
        .traffic-light-container {
            width: 100vw; max-width: 450px; background-color: #222; padding: 10px 0;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-bottom: 4px solid #111;
            position: relative;
        }
        /* 크기를 모바일 뷰에 맞춰 소폭 최적화 */
        .light-box {
            width: 130px; height: 130px; background-color: #111; border-radius: 50%;
            border: 4px solid #333; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: background-color 0.15s, box-shadow 0.15s; -webkit-tap-highlight-color: transparent;
        }
        /* 사람 모양 다이어그램 시인성 대폭 개선 (항상 아주 어두운 검정 실루엣) */
        .walk-svg { width: 75px; height: 75px; fill: #111111; z-index: 2; pointer-events: none; }
        
        /* 불빛이 들어올 때: 사람 모양이 아닌 동그란 배경 전구만 밝아짐 */
        .light-box.red-light { background-color: var(--red-off); }
        .light-box.red-light.active { background-color: var(--red-on); box-shadow: 0 0 25px var(--red-on); }
        
        .light-box.green-light { background-color: var(--green-off); }
        .light-box.green-light.active { background-color: var(--green-on); box-shadow: 0 0 25px var(--green-on); }
        
        /* 초록불 깜빡임 효과 - 배경만 깜빡이도록 개선 */
        @keyframes blink-bg { 0%, 49% { background-color: var(--green-on); } 50%, 100% { background-color: var(--green-off); } }
        .light-box.green-light.blinking { animation: blink-bg 0.5s infinite; }
        
        /* 제어판 크기 및 여백 최적화 */
        .control-panel {
            width: 90vw; max-width: 400px; background: #2a2a2a; margin-top: 10px;
            padding: 10px 15px; border-radius: 12px; color: white; box-sizing: border-box; font-size: 13px;
        }
        .mode-select { display: flex; justify-content: space-around; margin-bottom: 8px; }
        .mode-btn { flex: 1; margin: 0 4px; padding: 8px; background: #444; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .mode-btn.active { background: #007aff; }
        .time-settings { display: flex; flex-direction: column; gap: 6px; }
        .time-input-group { display: flex; justify-content: space-between; align-items: center; }
        .time-input-group input { width: 55px; padding: 4px; border-radius: 4px; border: 1px solid #666; background: #444; color: white; text-align: center; }
        
        /* 하단 자동차 도로 영역 확보 */
        .road-container {
            flex: 1; width: 100%; background-color: #444; position: relative;
            display: flex; align-items: center; border-top: 3px dashed #fff; border-bottom: 3px dashed #fff;
            margin-top: 10px; overflow: hidden; min-height: 100px;
        }
        /* 차량 이미지 반전으로 우측 전진 방향 일치 */
        .car {
            width: 80px; height: 50px; position: absolute; left: -100px; font-size: 42px;
            display: flex; justify-content: center; align-items: center;
            transform: scaleX(-1); pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="traffic-light-container">
        <!-- 타이머 좌상단 배치 -->
        <div id="timerDisplay" class="timer-display">5</div>
        
        <div id="redLight" class="light-box red-light active" onclick="handleLightClick('RED')">
            <svg class="walk-svg" viewBox="0 0 24 24"><path d="M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M10.5,22V16H8V11H16V16H13.5V22H10.5Z" /></svg>
        </div>
        <div id="greenLight" class="light-box green-light" onclick="handleLightClick('GREEN')">
            <svg class="walk-svg" viewBox="0 0 24 24"><path d="M13.5,5.5A1.5,1.5 0 0,1 15,7A1.5,1.5 0 0,1 13.5,8.5A1.5,1.5 0 0,1 12,7A1.5,1.5 0 0,1 12,5.5M9.8,22L11,17.3L13,19V22H15V17.5L13.2,15.8L13.8,12.7C14.7,13.8 16,14.5 17.5,14.5V12.5C16.2,12.5 15.2,11.7 14.7,10.7L13.8,9.2C13.5,8.7 12.9,8.4 12.3,8.4C12,8.4 11.7,8.5 11.4,8.6L7,10.5V14.5H9V11.8L10.6,11.2L9.1,18.3L5.4,17.5L5,19.5L9.8,22Z" /></svg>
        </div>
    </div>
    <div class="control-panel">
        <div class="mode-select">
            <button id="btnAuto" class="mode-btn active" onclick="setMode('AUTO')">자동 모드</button>
            <button id="btnManual" class="mode-btn" onclick="setMode('MANUAL')">수동 모드</button>
        </div>
        <div class="time-settings">
            <div class="time-input-group"><label>🔴 빨간불 시간 (초):</label><input type="number" id="inputRedTime" value="5" min="2" onchange="updateSettings()"></div>
            <div class="time-input-group"><label>🟢 초록불 시간 (초):</label><input type="number" id="inputGreenTime" value="8" min="5" onchange="updateSettings()"></div>
        </div>
    </div>
    <div class="road-container" id="road"><div id="carLayer"></div></div>
    <script>
        let currentLight = 'RED', currentMode = 'AUTO', timeLeft = 5, mainTimer = null;
        let settings = { redTime: 5, greenTime: 8, blinkStart: 3 };
        let audioCtx = null;
        
        function initAudio() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } }
        
        // 딩동 신호음 반응 지연 제거 및 싱크 한박자 당김
        function playDongDang() {
            try { 
                initAudio(); 
                const now = audioCtx.currentTime;
                
                // 첫 음 (딩~) - 불 켜지자마자 즉시 재생
                let osc1 = audioCtx.createOscillator(), gain1 = audioCtx.createGain(); 
                osc1.type = 'sine'; osc1.frequency.setValueAtTime(987.77, now); 
                gain1.gain.setValueAtTime(0.2, now); gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.35); 
                osc1.connect(gain1); gain1.connect(audioCtx.destination); osc1.start(now); osc1.stop(now + 0.35);
                
                // 두 번째 음 (동~) - 간격을 0.22초에서 0.18초로 축소하여 한 박 쉬는 느낌 완벽 해소
                let osc2 = audioCtx.createOscillator(), gain2 = audioCtx.createGain(); 
                osc2.type = 'sine'; osc2.frequency.setValueAtTime(783.99, now + 0.18); 
                gain2.gain.setValueAtTime(0.2, now + 0.18); gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.53); 
                osc2.connect(gain2); gain2.connect(audioCtx.destination); osc2.start(now + 0.18); osc2.stop(now + 0.53);
            } catch(e) { console.log(e); }
        }
        
        window.onload = function() { updateSettings(); resetTimer(); startLoop(); initCars(); };
        
        function updateSettings() {
            settings.redTime = parseInt(document.getElementById('inputRedTime').value) || 5; 
            settings.greenTime = parseInt(document.getElementById('inputGreenTime').value) || 8;
            if(currentLight === 'RED' && timeLeft > settings.redTime) timeLeft = settings.redTime; 
            if(currentLight === 'GREEN' && timeLeft > settings.greenTime) timeLeft = settings.greenTime;
            document.getElementById('timerDisplay').innerText = (currentMode === 'MANUAL') ? "-" : timeLeft;
        }
        
        function setMode(mode) {
            currentMode = mode; 
            document.getElementById('btnAuto').classList.toggle('active', mode === 'AUTO'); 
            document.getElementById('btnManual').classList.toggle('active', mode === 'MANUAL');
            if(mode === 'MANUAL') { document.getElementById('timerDisplay').innerText = "-"; clearInterval(mainTimer); document.getElementById('greenLight').classList.remove('blinking'); } else { resetTimer(); startLoop(); }
        }
        
        function resetTimer() { timeLeft = (currentLight === 'RED') ? settings.redTime : settings.greenTime; document.getElementById('timerDisplay').innerText = timeLeft; }
        
        function startLoop() {
            clearInterval(mainTimer);
            mainTimer = setInterval(() => {
                if (currentMode === 'MANUAL') return;
                timeLeft--; document.getElementById('timerDisplay').innerText = timeLeft;
                const greenLightDiv = document.getElementById('greenLight');
                if (currentLight === 'GREEN' && timeLeft <= settings.blinkStart) { greenLightDiv.classList.add('blinking'); } else { greenLightDiv.classList.remove('blinking'); }
                if (timeLeft <= 0) { switchLight(); }
            }, 1000);
        }
        
        function handleLightClick(clickedLight) { initAudio(); if (currentMode === 'MANUAL') { if (currentLight !== clickedLight) { currentLight = clickedLight; renderLightUI(); } } else { switchLight(); } }
        
        function switchLight() { currentLight = (currentLight === 'RED') ? 'GREEN' : 'RED'; renderLightUI(); if (currentMode === 'AUTO') { resetTimer(); } }
        
        function renderLightUI() {
            const redLightDiv = document.getElementById('redLight'), greenLightDiv = document.getElementById('greenLight'); 
            greenLightDiv.classList.remove('blinking');
            if (currentLight === 'RED') { redLightDiv.classList.add('active'); greenLightDiv.classList.remove('active'); } 
            else { redLightDiv.classList.remove('active'); greenLightDiv.classList.add('active'); playDongDang(); }
        }
        
        // 다중 자동차 관리 시스템
        let carsData = [];
        const carEmojis = ['🚗', '🚑', '🚌', '🚒', '🚕', '🚚', '🚓'];
        
        function initCars() {
            const carLayer = document.getElementById('carLayer');
            carLayer.innerHTML = '';
            carsData = [];
            
            // 3대의 자동차 생성 및 초기 배치 간격 이격
            for(let i=0; i<3; i++) {
                let carDiv = document.createElement('div');
                carDiv.className = 'car';
                carDiv.innerText = carEmojis[Math.floor(Math.random() * carEmojis.length)];
                carLayer.appendChild(carDiv);
                
                carsData.push({
                    element: carDiv,
                    x: -100 - (i * 140), // 차량 간 겹치지 않게 초기 스폰 대기 거리 분산
                    speed: 3 + Math.random() * 2.5
                });
            }
            
            function animate() {
                const roadWidth = document.getElementById('road').clientWidth;
                
                carsData.forEach((car) => {
                    if (currentLight === 'GREEN') {
                        car.x += car.speed; // 초록불일 땐 각자의 속도로 주행
                    }
                    // 빨간불일 때는 주행하지 않고 그대로 멈춤 (어디서든 정지 기능 유지)
                    
                    // 화면 밖으로 완전히 사라지면 재시작
                    if (car.x > roadWidth + 50) {
                        car.x = -90;
                        car.speed = 3 + Math.random() * 2.5; // 리스폰 시 속도 재지정
                        car.element.innerText = carEmojis[Math.floor(Math.random() * carEmojis.length)];
                    }
                    car.element.style.left = car.x + 'px';
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
