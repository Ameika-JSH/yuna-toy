<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유아용 신호등 놀이</title>
    <style>
        :root {
            --red-on: #ff3b30;
            --red-off: #111111;
            --green-on: #34c759;
            --green-off: #111111;
            --bg-red-on: #ff3b30;
            --bg-red-off: #4d0f0c;
            --bg-green-on: #34c759;
            --bg-green-off: #0f3d1b;
        }
        body {
            margin: 0; padding: 0; background-color: #1a1a1a;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden; user-select: none;
        }
        .timer-display {
            position: absolute; top: 10px; left: 10px;
            color: #fff; font-size: 20px; font-weight: bold;
            background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 8px;
            z-index: 10; min-width: 30px; text-align: center;
        }
        .traffic-light-container {
            width: 100vw; max-width: 450px; background-color: #333; padding: 12px 0;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); border-bottom: 5px solid #222;
            position: relative;
        }
        .light-box {
            width: 130px; height: 130px; border-radius: 50%;
            border: 5px solid #444; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: background-color 0.05s, box-shadow 0.05s; -webkit-tap-highlight-color: transparent;
        }
        .walk-svg { width: 75px; height: 75px; fill: #111111; z-index: 2; }
        
        .light-box.red-light { background-color: var(--bg-red-off); }
        .light-box.red-light.active { background-color: var(--bg-red-on); box-shadow: 0 0 35px var(--bg-red-on); }
        
        .light-box.green-light { background-color: var(--bg-green-off); }
        .light-box.green-light.active { background-color: var(--bg-green-on); box-shadow: 0 0 35px var(--bg-green-on); }
        
        @keyframes blink { 
            0%, 49% { background-color: var(--bg-green-on); box-shadow: 0 0 35px var(--bg-green-on); } 
            50%, 100% { background-color: var(--bg-green-off); box-shadow: none; } 
        }
        .light-box.green-light.blinking { animation: blink 0.5s infinite; }
        
        .control-panel { width: 90vw; max-width: 400px; background: #2a2a2a; margin-top: 10px; padding: 12px; border-radius: 12px; color: white; box-sizing: border-box; }
        .mode-select { display: flex; justify-content: space-around; margin-bottom: 10px; }
        .mode-btn { flex: 1; margin: 0 4px; padding: 8px; background: #444; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .mode-btn.active { background: #007aff; }
        .time-settings { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
        .time-input-group { display: flex; justify-content: space-between; align-items: center; }
        .time-input-group input { width: 55px; padding: 4px; border-radius: 5px; border: 1px solid #666; background: #444; color: white; text-align: center; }
        
        .road-container {
            flex: 1; width: 100%; background-color: #444; position: relative;
            display: flex; flex-direction: column; justify-content: space-around;
            padding: 10px 0; margin-top: auto; overflow: hidden; box-sizing: border-box;
        }
        .lane {
            height: 25%; width: 100%; border-bottom: 2px dashed rgba(255,255,255,0.4);
            position: relative; display: flex; align-items: center;
        }
        .lane:last-child { border-bottom: none; }
        .car {
            position: absolute; left: -120px; font-size: 38px;
            display: flex; justify-content: center; align-items: center;
            transform: scaleX(-1);
            will-change: left;
        }
    </style>
</head>
<body>
    <div id="timerDisplay" class="timer-display">5</div>
    <div class="traffic-light-container">
        <div id="redLight" class="light-box red-light active" onclick="handleLightClick('RED')">
            <svg class="walk-svg" viewBox="0 0 24 24"><path d="M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M10.5,22V16H8V11H16V16H13.5V22H10.5Z" /></svg>
        </div>
        <div id="greenLight" class="light-box green-light" onclick="handleLightClick('GREEN')">
            <svg class="walk-svg" viewBox="0 0 24 24"><path d="M13.5,5.5A1.5,1.5 0 0,1 15,7A1.5,1.5 0 0,1 13.5,8.5A1.5,1.5 0 0,1 12,7A1.5,1.5 0 0,1 12,5.5M9.8,22L11,17.3L13,19V22H15V17.5L13.2,15.8L13.8,12.7C14.7,13.8 16,14.5 17.5,14.5V12.5C16.2,12.5 15.2,11.7 14.7,10.7L13.8,9.2C13.5,8.7 12.9,8.4 12.3,8.4C12,8.4 11.7,8.5 11.4,8.6L7,10.5V14.5H9V11.8L10.6,11.2L9.1,18.3L5.4,17.5L5,19.5L9.8,22Z" /></svg>
        </div>
    </div>
    <div class="control-panel">
        <div class="mode-select">
            <button id="btnAuto" class="mode-btn active" onclick="setMode('AUTO')">자동 모드</button>
            <button id="btnManual" class="mode-btn" onclick="setMode('MANUAL')">수동 모드</button>
        </div>
        <div class="time-settings">
            <div class="time-input-group"><label>🔴 빨간불 시간 (초):</label><input type="number" id="inputRedTime" value="5" min="2" onchange="updateSettings()"></div>
            <div class="time-input-group"><label>🟢 초록불 시간 (초):</label><input type="number" id="inputGreenTime" value="8" min="5" onchange="updateSettings()"></div>
        </div>
    </div>
    <div class="road-container" id="road">
        <div class="lane" id="lane0"></div>
        <div class="lane" id="lane1"></div>
        <div class="lane" id="lane2"></div>
    </div>
    <script>
        let currentLight = 'RED', currentMode = 'AUTO', timeLeft = 5, mainTimer = null, carAnimation = null;
        let settings = { redTime: 5, greenTime: 8, blinkStart: 3 };
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        
        window.addEventListener('click', initAudio, { once: true });
        window.addEventListener('touchstart', initAudio, { once: true });

        function playDongDangDirect() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                let osc1 = audioCtx.createOscillator(), gain1 = audioCtx.createGain();
                osc1.type = 'sine'; osc1.frequency.setValueAtTime(987.77, now);
                gain1.gain.setValueAtTime(0.15, now); gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc1.connect(gain1); gain1.connect(audioCtx.destination);
                osc1.start(now); osc1.stop(now + 0.35);

                let osc2 = audioCtx.createOscillator(), gain2 = audioCtx.createGain();
                osc2.type = 'sine'; osc2.frequency.setValueAtTime(783.99, now + 0.25);
                gain2.gain.setValueAtTime(0.15, now + 0.25); gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc2.connect(gain2); gain2.connect(audioCtx.destination);
                osc2.start(now + 0.25); osc2.stop(now + 0.6);
            } catch(e) { console.log(e); }
        }

        window.onload = function() {
            updateSettings(); resetTimer(); startLoop(); initCarsSystem();
        };

        function updateSettings() {
            settings.redTime = parseInt(document.getElementById('inputRedTime').value) || 5;
            settings.greenTime = parseInt(document.getElementById('inputGreenTime').value) || 8;
            if(currentLight === 'RED' && timeLeft > settings.redTime) timeLeft = settings.redTime;
            if(currentLight === 'GREEN' && timeLeft > settings.greenTime) timeLeft = settings.greenTime;
            document.getElementById('timerDisplay').innerText = (currentMode === 'MANUAL') ? "-" : timeLeft;
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnAuto').classList.toggle('active', mode === 'AUTO');
            document.getElementById('btnManual').classList.toggle('active', mode === 'MANUAL');
            if(mode === 'MANUAL') {
                document.getElementById('timerDisplay').innerText = "-";
                clearInterval(mainTimer);
                document.getElementById('greenLight').classList.remove('blinking');
            } else {
                resetTimer(); startLoop();
            }
        }

        function resetTimer() {
            timeLeft = (currentLight === 'RED') ? settings.redTime : settings.greenTime;
            document.getElementById('timerDisplay').innerText = timeLeft;
        }

        function startLoop() {
            clearInterval(mainTimer);
            mainTimer = setInterval(() => {
                if (currentMode === 'MANUAL') return;
                timeLeft--;
                document.getElementById('timerDisplay').innerText = timeLeft;
                const greenLightDiv = document.getElementById('greenLight');
                if (currentLight === 'GREEN' && timeLeft <= settings.blinkStart) {
                    greenLightDiv.classList.add('blinking');
                } else {
                    greenLightDiv.classList.remove('blinking');
                }
                if (timeLeft <= 0) { switchLight(); }
            }, 1000);
        }

        function handleLightClick(clickedLight) {
            initAudio();
            if (currentMode === 'MANUAL') {
                if (currentLight !== clickedLight) {
                    currentLight = clickedLight;
                    renderLightUI();
                }
            } else {
                switchLight();
            }
        }

        function switchLight() {
            currentLight = (currentLight === 'RED') ? 'GREEN' : 'RED';
            renderLightUI();
            if (currentMode === 'AUTO') { resetTimer(); }
        }

        function renderLightUI() {
            const redLightDiv = document.getElementById('redLight');
            const greenLightDiv = document.getElementById('greenLight');
            greenLightDiv.classList.remove('blinking');
            if (currentLight === 'RED') {
                redLightDiv.classList.add('active');
                greenLightDiv.classList.remove('active');
            } else {
                redLightDiv.classList.remove('active');
                greenLightDiv.classList.add('active');
                playDongDangDirect();
            }
        }

        let lanesData = [[], [], []];
        const carEmojis = ['🚗', '🚑', '🚌', '🚒', '🚕', '🚚', '🚓'];

        function initCarsSystem() {
            const road = document.getElementById('road');
            for(let i=0; i<3; i++) {
                const laneEl = document.getElementById('lane'+i);
                laneEl.innerHTML = '';
                lanesData[i] = [];
                spawnCarInLane(i, Math.random() * 200 + 50);
            }

            function spawnCarInLane(laneIndex, initialX = -120) {
                const laneEl = document.getElementById('lane'+laneIndex);
                const carDiv = document.createElement('div');
                carDiv.className = 'car';
                carDiv.innerText = carEmojis[Math.floor(Math.random() * carEmojis.length)];
                carDiv.style.left = initialX + 'px';
                laneEl.appendChild(carDiv);

                let speed = 2.5 + Math.random() * 2.5;
                let carObj = { el: carDiv, x: initialX, speed: speed, width: 90 };
                lanesData[laneIndex].push(carObj);
            }

            function animate() {
                const roadWidth = road.clientWidth || window.innerWidth;
                
                for(let i=0; i<3; i++) {
                    let laneCars = lanesData[i];
                    
                    for(let j=0; j<laneCars.length; j++) {
                        let car = laneCars[j];
                        
                        if (currentLight === 'RED') {
                            // No movement
                        } else {
                            let canMove = true;
                            if (j > 0) {
                                let leadCar = laneCars[j-1];
                                if (leadCar.x - (car.x + car.width) < 40) {
                                    if (car.x < leadCar.x) {
                                        car.speed = Math.min(car.speed, leadCar.speed);
                                        if (leadCar.x - (car.x + car.width) < 15) {
                                            canMove = false;
                                        }
                                    }
                                }
                            }
                            if (canMove) {
                                car.x += car.speed;
                            }
                        }
                        car.el.style.left = car.x + 'px';
                    }

                    if (laneCars.length > 0 && laneCars[0].x > roadWidth + 50) {
                        let removed = laneCars.shift();
                        removed.el.remove();
                    }

                    if (laneCars.length === 0) {
                        spawnCarInLane(i, -120);
                    } else {
                        let lastCar = laneCars[laneCars.length - 1];
                        if (lastCar.x > 150 && laneCars.length < 3) {
                            spawnCarInLane(i, -120);
                        }
                    }
                }
                carAnimation = requestAnimationFrame(animate);
            }

            if(carAnimation) cancelAnimationFrame(carAnimation);
            animate();
        }
    </script>
</body>
</html>
