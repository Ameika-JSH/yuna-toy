<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유아용 신호등 놀이</title>
    <style>
        :root {
            --red-on: #ff3b30;
            --red-off: #4d0f0c;
            --green-on: #34c759;
            --green-off: #0f3d1b;
        }
        body {
            margin: 0; padding: 0; background-color: #1a1a1a;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden; user-select: none;
            position: relative;
        }
        .timer-display {
            position: absolute; top: 15px; left: 15px;
            color: #fff; font-size: 20px; font-weight: bold;
            background: rgba(0, 0, 0, 0.6); padding: 5px 12px;
            border-radius: 8px; z-index: 10;
        }
        .traffic-light-container {
            width: 100vw; max-width: 450px; background-color: #333;
            padding: 12px 0; display: flex; flex-direction: column;
            align-items: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); border-bottom: 5px solid #222;
        }
        .light-box {
            width: 130px; height: 130px; background-color: #222; border-radius: 50%;
            border: 5px solid #444; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: background-color 0.1s, box-shadow 0.1s; -webkit-tap-highlight-color: transparent;
        }
        .walk-svg { width: 75px; height: 75px; fill: #111; transition: filter 0.1s; }
        .light-box.red-light { background-color: var(--red-off); }
        .light-box.red-light.active { background-color: var(--red-on); box-shadow: 0 0 35px var(--red-on); }
        .light-box.red-light.active .walk-svg { filter: drop-shadow(0 0 2px #000); }
        .light-box.green-light { background-color: var(--green-off); }
        .light-box.green-light.active { background-color: var(--green-on); box-shadow: 0 0 35px var(--green-on); }
        .light-box.green-light.active .walk-svg { filter: drop-shadow(0 0 2px #000); }
        @keyframes blink { 0%, 49% { background-color: var(--green-on); } 50%, 100% { background-color: var(--green-off); } }
        .light-box.green-light.blinking { animation: blink 0.5s infinite; }
        .control-panel {
            width: 90vw; max-width: 400px; background: #2a2a2a;
            margin-top: 10px; padding: 10px 15px; border-radius: 12px;
            color: white; box-sizing: border-box; font-size: 13px;
        }
        .mode-select { display: flex; justify-content: space-around; margin-bottom: 10px; }
        .mode-btn { flex: 1; margin: 0 5px; padding: 8px; background: #444; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .mode-btn.active { background: #007aff; }
        .time-settings { display: flex; flex-direction: column; gap: 6px; }
        .time-input-group { display: flex; justify-content: space-between; align-items: center; }
        .time-input-group input { width: 55px; padding: 4px; border-radius: 5px; border: 1px solid #666; background: #444; color: white; text-align: center; font-size: 13px; }
        
        .road-container {
            flex: 1; width: 100%; background-color: #444;
            position: relative; display: flex; flex-direction: column;
            margin-top: auto; overflow: hidden;
        }
        .lane {
            flex: 1; width: 100%; position: relative;
            display: flex; align-items: center;
            box-sizing: border-box;
        }
        .lane:not(:last-child) {
            border-bottom: 3px dashed #fff;
        }
        .car {
            width: 80px; height: 45px; position: absolute; left: -100px;
            font-size: 36px; display: flex; justify-content: center; align-items: center;
            transform: scaleX(-1);
        }
    </style>
</head>
<body>
    <div id="timerDisplay" class="timer-display">5</div>
    <div class="traffic-light-container">
        <div id="redLight" class="light-box red-light active" onclick="handleLightClick('RED')">
            <svg class="walk-svg" viewBox="0 0 24 24"><path d="M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M10.5,22V16H8V11H16V16H13.5V22H10.5Z" /></svg>
        </div>
        <div id="greenLight" class="light-box green-light" onclick="handleLightClick('GREEN')">
            <svg class="walk-svg" viewBox="0 0 24 24"><path d="M13.5,5.5A1.5,1.5 0 0,1 15,7A1.5,1.5 0 0,1 13.5,8.5A1.5,1.5 0 0,1 12,7A1.5,1.5 0 0,1 12,5.5M9.8,22L11,17.3L13,19V22H15V17.5L13.2,15.8L13.8,12.7C14.7,13.8 16,14.5 17.5,14.5V12.5C16.2,12.5 15.2,11.7 14.7,10.7L13.8,9.2C13.5,8.7 12.9,8.4 12.3,8.4C12,8.4 11.7,8.5 11.4,8.6L7,10.5V14.5H9V11.8L10.6,11.2L9.1,18.3L5.4,17.5L5,19.5L9.8,22Z" /></svg>
        </div>
    </div>
    <div class="control-panel">
        <div class="mode-select">
            <button id="btnAuto" class="mode-btn active" onclick="setMode('AUTO')">자동 모드</button>
            <button id="btnManual" class="mode-btn" onclick="setMode('MANUAL')">수동 모드</button>
        </div>
        <div class="time-settings">
            <div class="time-input-group"><label>🔴 빨간불 시간 (초):</label><input type="number" id="inputRedTime" value="5" min="2" onchange="updateSettings()"></div>
            <div class="time-input-group"><label>🟢 초록불 시간 (초):</label><input type="number" id="inputGreenTime" value="8" min="5" onchange="updateSettings()"></div>
        </div>
    </div>
    <div class="road-container">
        <div class="lane" id="lane0"></div>
        <div class="lane" id="lane1"></div>
        <div class="lane" id="lane2"></div>
    </div>
    <script>
        let currentLight = 'RED', currentMode = 'AUTO', timeLeft = 5, mainTimer = null, carAnimation = null;
        let settings = { redTime: 5, greenTime: 8, blinkStart: 3 };
        let audioCtx = null;
        
        let lanesData = [
            { id: 0, cars: [] },
            { id: 1, cars: [] },
            { id: 2, cars: [] }
        ];
        const carEmojis = ['🚗', '🚑', '🚌', '🚒', '🚕', '🚚', '🚓'];

        function initAudio() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } }
        function playDongDang() {
            try { initAudio(); const now = audioCtx.currentTime;
                let osc1 = audioCtx.createOscillator(), gain1 = audioCtx.createGain(); osc1.type = 'sine'; osc1.frequency.setValueAtTime(987.77, now); gain1.gain.setValueAtTime(0.2, now); gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc1.connect(gain1); gain1.connect(audioCtx.destination); osc1.start(now); osc1.stop(now + 0.3);
                let osc2 = audioCtx.createOscillator(), gain2 = audioCtx.createGain(); osc2.type = 'sine'; osc2.frequency.setValueAtTime(783.99, now + 0.15); gain2.gain.setValueAtTime(0.2, now + 0.15); gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.45); osc2.connect(gain2); gain2.connect(audioCtx.destination); osc2.start(now + 0.15); osc2.stop(now + 0.45);
            } catch(e) { console.log(e); }
        }
        window.onload = function() { updateSettings(); resetTimer(); startLoop(); initTrafficFlow(); };
        function updateSettings() {
            settings.redTime = parseInt(document.getElementById('inputRedTime').value) || 5; settings.greenTime = parseInt(document.getElementById('inputGreenTime').value) || 8;
            if(currentLight === 'RED' && timeLeft > settings.redTime) timeLeft = settings.redTime; if(currentLight === 'GREEN' && timeLeft > settings.greenTime) timeLeft = settings.greenTime;
            document.getElementById('timerDisplay').innerText = (currentMode === 'MANUAL') ? "-" : timeLeft;
        }
        function setMode(mode) {
            currentMode = mode; document.getElementById('btnAuto').classList.toggle('active', mode === 'AUTO'); document.getElementById('btnManual').classList.toggle('active', mode === 'MANUAL');
            if(mode === 'MANUAL') { document.getElementById('timerDisplay').innerText = "-"; clearInterval(mainTimer); document.getElementById('greenLight').classList.remove('blinking'); } else { resetTimer(); startLoop(); }
        }
        function resetTimer() { timeLeft = (currentLight === 'RED') ? settings.redTime : settings.greenTime; document.getElementById('timerDisplay').innerText = timeLeft; }
        function startLoop() {
            clearInterval(mainTimer);
            mainTimer = setInterval(() => {
                if (currentMode === 'MANUAL') return;
                timeLeft--; document.getElementById('timerDisplay').innerText = timeLeft;
                const greenLightDiv = document.getElementById('greenLight');
                if (currentLight === 'GREEN' && timeLeft <= settings.blinkStart) { greenLightDiv.classList.add('blinking'); } else { greenLightDiv.classList.remove('blinking'); }
                if (timeLeft <= 0) { switchLight(); }
            }, 1000);
        }
        function handleLightClick(clickedLight) { initAudio(); if (currentMode === 'MANUAL') { if (currentLight !== clickedLight) { currentLight = clickedLight; renderLightUI(); } } else { switchLight(); } }
        function switchLight() { currentLight = (currentLight === 'RED') ? 'GREEN' : 'RED'; renderLightUI(); if (currentMode === 'AUTO') { resetTimer(); } }
        function renderLightUI() {
            const redLightDiv = document.getElementById('redLight'), greenLightDiv = document.getElementById('greenLight'); greenLightDiv.classList.remove('blinking');
            if (currentLight === 'RED') { redLightDiv.classList.add('active'); greenLightDiv.classList.remove('active'); } else { redLightDiv.classList.remove('active'); greenLightDiv.classList.add('active'); playDongDang(); }
        }
        
        function createCarObject(laneId, isInitial = false) {
            const laneEl = document.getElementById('lane' + laneId);
            const carEl = document.createElement('div');
            carEl.className = 'car';
            carEl.innerText = carEmojis[Math.floor(Math.random() * carEmojis.length)];
            laneEl.appendChild(carEl);

            const speed = 3.0 + Math.random() * 2.0; 
            let initialX = -100;
            if (isInitial && lanesData[laneId].cars.length > 0) {
                initialX = -280; 
            }

            return { element: carEl, x: initialX, speed: speed, width: 80 };
        }

        function initTrafficFlow() {
            for (let i = 0; i < 3; i++) {
                lanesData[i].cars.push(createCarObject(i));
                if (Math.random() > 0.4) {
                    lanesData[i].cars.push(createCarObject(i, true));
                }
            }

            function animate() {
                const roadWidth = document.querySelector('.road-container').clientWidth;
                const safeDistance = 110;

                for (let i = 0; i < 3; i++) {
                    let lane = lanesData[i];
                    lane.cars.sort((a, b) => b.x - a.x);

                    for (let j = 0; j < lane.cars.length; j++) {
                        let car = lane.cars[j];
                        let canMove = true;

                        if (currentLight === 'RED') {
                            canMove = false;
                        } else {
                            if (j > 0) { 
                                let frontCar = lane.cars[j-1];
                                if (frontCar.x - car.x < safeDistance) {
                                    canMove = false;
                                    if (frontCar.x - car.x > safeDistance - 15) {
                                        car.x = frontCar.x - safeDistance;
                                    }
                                }
                            }
                        }

                        if (canMove) { car.x += car.speed; }

                        if (car.x > roadWidth + 50) {
                            let lastCar = lane.cars[lane.cars.length - 1];
                            if (lane.cars.length === 1 || (lastCar && lastCar.x > 120)) {
                                car.x = -100;
                                car.speed = 3.0 + Math.random() * 2.0;
                                car.element.innerText = carEmojis[Math.floor(Math.random() * carEmojis.length)];
                            } else {
                                car.x = -250;
                            }
                        }
                        car.element.style.left = car.x + 'px';
                    }
                }
                carAnimation = requestAnimationFrame(animate);
            }
            if(carAnimation) cancelAnimationFrame(carAnimation);
            animate();
        }
    </script>
</body>
</html>
