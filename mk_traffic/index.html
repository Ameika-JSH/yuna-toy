<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유아용 신호등 놀이</title>
    <style>
        :root {
            --red-on: #ff3b30;
            --red-off: #2a0b0a;
            --green-on: #34c759;
            --green-off: #0a2a14;
        }
        body {
            margin: 0; padding: 0; background-color: #1a1a1a;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden; user-select: none;
            position: relative;
        }
        .timer-display {
            position: absolute; top: 15px; left: 15px;
            color: #fff; font-size: 20px; font-weight: bold; background: #000;
            padding: 4px 12px; border-radius: 8px; min-width: 30px; text-align: center;
            z-index: 10; border: 1px solid #444;
        }
        .traffic-light-container {
            width: 100vw; max-width: 450px; background-color: #222; padding: 15px 0;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); border-bottom: 5px solid #111;
        }
        .light-box {
            width: 130px; height: 130px; background-color: #111; border-radius: 50%;
            border: 6px solid #444; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: background-color 0.15s, box-shadow 0.15s; -webkit-tap-highlight-color: transparent;
        }
        .walk-svg { width: 80px; height: 80px; fill: #111111; }
        .light-box.red-light { background-color: var(--red-off); }
        .light-box.red-light.active { background-color: var(--red-on); box-shadow: 0 0 35px var(--red-on); }
        .light-box.green-light { background-color: var(--green-off); }
        .light-box.green-light.active { background-color: var(--green-on); box-shadow: 0 0 35px var(--green-on); }
        @keyframes blink { 
            0%, 49% { background-color: var(--green-on); box-shadow: 0 0 35px var(--green-on); } 
            50%, 100% { background-color: var(--green-off); box-shadow: none; } 
        }
        .light-box.green-light.blinking { animation: blink 0.5s infinite; }

        .control-panel { width: 92vw; max-width: 400px; background: #2a2a2a; margin-top: 10px; padding: 12px; border-radius: 12px; color: white; box-sizing: border-box; }
        .control-panel.collapsed { padding: 8px 12px; }
        .control-panel-header { display: flex; justify-content: space-between; align-items: center; }
        .control-panel-title { font-size: 13px; font-weight: bold; }
        .settings-toggle { padding: 6px 12px; background: #444; border: 1px solid #666; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .settings-content { margin-top: 8px; }
        .control-panel.collapsed .settings-content { display: none; }
        .mode-select { display: flex; justify-content: space-around; margin-bottom: 10px; }
        .mode-btn { flex: 1; margin: 0 4px; padding: 8px; background: #444; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .mode-btn.active { background: #007aff; }
        .time-settings { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
        .time-input-group { display: flex; justify-content: space-between; align-items: center; }
        .time-input-group input { width: 55px; padding: 4px; border-radius: 4px; border: 1px solid #666; background: #444; color: white; text-align: center; }
        
        /* 캐릭터 프렌즈 전환 패널 */
        .friend-panel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; border-top: 1px solid #444; padding-top: 10px; }
        .friend-panel label { flex: 1 0 100%; }
        .friend-btn { flex: 1 1 calc(33.333% - 6px); margin: 0; padding: 8px 4px; background: #3a3a3a; border: 2px solid #555; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .friend-btn.active { background: #e91e63; border-color: #ff4081; }

        .road-container {
            flex: 1; width: 100%; background-color: #444; position: relative;
            display: flex; flex-direction: column; justify-content: space-around;
            padding: 10px 0; margin-top: auto; overflow: hidden; border-top: 4px solid #fff;
        }
        .lane { width: 100%; height: 2px; border-top: 2px dashed #fff; opacity: 0.4; position: absolute; }
        .lane-1 { top: 33.3%; }
        .lane-2 { top: 66.6%; }

        .crosswalk {
            position: absolute; left: 50%; top: 0; bottom: 0; width: 110px;
            transform: translateX(-50%); display: flex; flex-direction: column;
            justify-content: space-between; pointer-events: none; z-index: 1;
        }
        .crosswalk-stripe { width: 100%; height: 8%; background-color: #fff; box-shadow: 0 0 2px rgba(0,0,0,0.2); }

        .car { width: 75px; height: 45px; position: absolute; left: -150px; font-size: 38px; display: flex; justify-content: center; align-items: center; transform: scaleX(-1); z-index: 3; }
        
        /* 유나를 위한 실제 오리지널 누끼 완료 이미지 배치 구조 */
        .pedestrian-img {
            position: absolute; left: 50%; top: -60px; transform: translateX(-50%);
            width: 65px; height: 65px; object-fit: contain; z-index: 4; display: none; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="timerDisplay" class="timer-display">5</div>

    <div class="traffic-light-container">
        <div id="redLight" class="light-box red-light active" onclick="handleLightClick('RED')">
            <svg class="walk-svg" viewBox="0 0 24 24"><path d="M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M10.5,22V16H8V11H16V16H13.5V22H10.5Z" /></svg>
        </div>
        <div id="greenLight" class="light-box green-light" onclick="handleLightClick('GREEN')">
            <svg class="walk-svg" viewBox="0 0 24 24"><path d="M13.5,5.5A1.5,1.5 0 0,1 15,7A1.5,1.5 0 0,1 13.5,8.5A1.5,1.5 0 0,1 12,7A1.5,1.5 0 0,1 12,5.5M9.8,22L11,17.3L13,19V22H15V17.5L13.2,15.8L13.8,12.7C14.7,13.8 16,14.5 17.5,14.5V12.5C16.2,12.5 15.2,11.7 14.7,10.7L13.8,9.2C13.5,8.7 12.9,8.4 12.3,8.4C12,8.4 11.7,8.5 11.4,8.6L7,10.5V14.5H9V11.8L10.6,11.2L9.1,18.3L5.4,17.5L5,19.5L9.8,22Z" /></svg>
        </div>
    </div>

    <div id="controlPanel" class="control-panel">
        <div class="control-panel-header">
            <span class="control-panel-title">⚙ 설정</span>
            <button id="settingsToggle" class="settings-toggle" type="button" aria-expanded="true" aria-controls="settingsContent" onclick="toggleSettings()">접기</button>
        </div>
        <div id="settingsContent" class="settings-content">
            <div class="mode-select">
                <button id="btnAuto" class="mode-btn active" onclick="setMode('AUTO')">자동 모드</button>
                <button id="btnManual" class="mode-btn" onclick="setMode('MANUAL')">수동 모드</button>
            </div>
            <div class="time-settings">
                <div class="time-input-group"><label>🔴 빨간불 유지 (초):</label><input type="number" id="inputRedTime" value="5" min="2" onchange="updateSettings()"></div>
                <div class="time-input-group"><label>🟢 초록불 유지 (초):</label><input type="number" id="inputGreenTime" value="8" min="5" onchange="updateSettings()"></div>
            </div>

            <!-- 친구 선택 버튼 추가 -->
            <div class="friend-panel">
                <label style="font-size: 13px; font-weight: bold;">👧 유나의 친구 선택:</label>
                <button id="btnMinnie" class="friend-btn active" onclick="selectFriend('MINNIE')">🎀 미니마우스</button>
                <button id="btnKitty" class="friend-btn" onclick="selectFriend('KITTY')">🌸 헬로키티</button>
                <button id="btnPororo" class="friend-btn" onclick="selectFriend('PORORO')">🐧 뽀로로</button>
                <button id="btnBulbasaur" class="friend-btn" onclick="selectFriend('BULBASAUR')">🌱 이상해씨</button>
                <button id="btnRubberDuck" class="friend-btn" onclick="selectFriend('RUBBER_DUCK')">🦆 러버덕</button>
                <button id="btnRandom" class="friend-btn" onclick="selectFriend('RANDOM')">🎲 랜덤</button>
            </div>
        </div>
    </div>

    <div class="road-container" id="road">
        <div class="lane lane-1"></div>
        <div class="lane lane-2"></div>
        
        <div class="crosswalk">
            <div class="crosswalk-stripe"></div>
            <div class="crosswalk-stripe"></div>
            <div class="crosswalk-stripe"></div>
            <div class="crosswalk-stripe"></div>
            <div class="crosswalk-stripe"></div>
        </div>

        <div id="car0" class="car">🚗</div>
        <div id="car1" class="car">🚌</div>
        <div id="car2" class="car">🚕</div>

        <!-- 캐릭터 이미지는 HTML 내부에 포함되어 별도 파일 없이 표시됩니다. -->
        <img id="pedestrian" class="pedestrian-img" src="" alt="character">
    </div>

            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        }

        function playCrosswalkStart() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const quarterNote = 60 / 105;
                [261.63, 329.63, 392, 523.25].forEach((frequency, index) => {
                    playTone(frequency, now + index * quarterNote, quarterNote * 0.9, 0.12);
                });
            } catch(e) { console.error(e); }
        }

        function startCrosswalkWarning() {
            try {
                initAudio();
                if (warningScheduler !== null) return;

                const sixteenthNote = 60 / (105 * 4);
                warningNextNoteTime = audioCtx.currentTime + 0.05;
                warningStep = 0;
                warningScheduler = setInterval(() => {
                    const scheduleUntil = audioCtx.currentTime + 0.1;
                    while (warningNextNoteTime < scheduleUntil) {
                        if (warningStep < 4) {
                            playTone(932.33, warningNextNoteTime, sixteenthNote * 0.45, 0.08);
                        }
                        warningNextNoteTime += sixteenthNote;
                        warningStep = (warningStep + 1) % 8;
                    }
                }, 25);
            } catch(e) { console.error(e); }
        }

        function stopCrosswalkWarning() {
            if (warningScheduler === null) return;
            clearInterval(warningScheduler);
            warningScheduler = null;
            warningStep = 0;
        }

        function playTone(frequency, startTime, duration, volume) {
            const oscillator = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, startTime);
            gain.gain.setValueAtTime(0.001, startTime);
            gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            oscillator.connect(gain);
            gain.connect(audioCtx.destination);
            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
        }

        window.onload = function() {
            document.body.addEventListener('click', initAudio, { once: true });
            document.body.addEventListener('touchstart', initAudio, { once: true });
            updateSettings(); resetTimer(); startLoop(); initTrafficSystem();
        };

        function toggleSettings() {
            const panel = document.getElementById('controlPanel');
            const button = document.getElementById('settingsToggle');
            const isCollapsed = panel.classList.toggle('collapsed');
            button.textContent = isCollapsed ? '펼치기' : '접기';
            button.setAttribute('aria-expanded', String(!isCollapsed));
        }

        function selectFriend(friend) {
            friendSelection = friend;
            currentFriend = friend === 'RANDOM' ? chooseRandomFriend() : friend;
            document.getElementById('btnMinnie').classList.toggle('active', friend === 'MINNIE');
            document.getElementById('btnKitty').classList.toggle('active', friend === 'KITTY');
            document.getElementById('btnPororo').classList.toggle('active', friend === 'PORORO');
            document.getElementById('btnBulbasaur').classList.toggle('active', friend === 'BULBASAUR');
            document.getElementById('btnRubberDuck').classList.toggle('active', friend === 'RUBBER_DUCK');
            document.getElementById('btnRandom').classList.toggle('active', friend === 'RANDOM');
            if (ped.active) {
                document.getElementById('pedestrian').src = friendImages[currentFriend];
            }
        }

        function chooseRandomFriend() {
            const friends = Object.keys(friendImages);
            return friends[Math.floor(Math.random() * friends.length)];
        }

        function updateSettings() {
            settings.redTime = parseInt(document.getElementById('inputRedTime').value) || 5;
            settings.greenTime = parseInt(document.getElementById('inputGreenTime').value) || 8;
            if(currentLight === 'RED' && timeLeft > settings.redTime) timeLeft = settings.redTime;
            if(currentLight === 'GREEN' && timeLeft > settings.greenTime) timeLeft = settings.greenTime;
            document.getElementById('timerDisplay').innerText = (currentMode === 'MANUAL') ? "-" : timeLeft;
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnAuto').classList.toggle('active', mode === 'AUTO');
            document.getElementById('btnManual').classList.toggle('active', mode === 'MANUAL');
            if(mode === 'MANUAL') {
                document.getElementById('timerDisplay').innerText = "-";
                clearInterval(mainTimer);
                document.getElementById('greenLight').classList.remove('blinking');
                stopCrosswalkWarning();
            } else {
                resetTimer(); startLoop();
            }
        }

        function resetTimer() {
            timeLeft = (currentLight === 'RED') ? settings.redTime : settings.greenTime;
            document.getElementById('timerDisplay').innerText = timeLeft;
        }

        function startLoop() {
            clearInterval(mainTimer);
            mainTimer = setInterval(() => {
                if (currentMode === 'MANUAL') return;
                timeLeft--;
                document.getElementById('timerDisplay').innerText = timeLeft;
                const greenLightDiv = document.getElementById('greenLight');
                
                if (currentLight === 'GREEN' && timeLeft <= settings.blinkStart) {
                    greenLightDiv.classList.add('blinking');
                    if (timeLeft > 0) startCrosswalkWarning();
                } else {
                    greenLightDiv.classList.remove('blinking');
                    stopCrosswalkWarning();
                }
                if (timeLeft <= 0) { switchLight(); }
            }, 1000);
        }

        function handleLightClick(clickedLight) {
            initAudio();
            if (currentMode === 'MANUAL') {
                if (currentLight !== clickedLight) { currentLight = clickedLight; renderLightUI(); }
            } else {
                switchLight();
            }
        }

        function switchLight() {
            currentLight = (currentLight === 'RED') ? 'GREEN' : 'RED';
            renderLightUI();
            if (currentMode === 'AUTO') { resetTimer(); }
        }

        function renderLightUI() {
            const redLightDiv = document.getElementById('redLight');
            const greenLightDiv = document.getElementById('greenLight');
            const pedDiv = document.getElementById('pedestrian');
            greenLightDiv.classList.remove('blinking');

            if (currentLight === 'RED') {
                stopCrosswalkWarning();
                redLightDiv.classList.add('active');
                greenLightDiv.classList.remove('active');
                ped.active = false;
                pedDiv.style.display = 'none';
            } else {
                redLightDiv.classList.remove('active');
                greenLightDiv.classList.add('active');
                playCrosswalkStart();
                
                const road = document.getElementById('road');
                ped.y = -60;
                // 초록불 설정 시간에 오차없이 수직 횡단하도록 바운더리 속도 계산
                ped.speed = (road.clientHeight + 80) / (settings.greenTime * 60);
                ped.active = true;
                
                currentFriend = friendSelection === 'RANDOM' ? chooseRandomFriend() : friendSelection;
                pedDiv.src = friendImages[currentFriend];
                pedDiv.style.top = ped.y + 'px';
                pedDiv.style.display = 'block';
            }
        }

        function initTrafficSystem() {
            const road = document.getElementById('road');
            const pedDiv = document.getElementById('pedestrian');
            const carEmojis = ['🚗', '🚑', '🚌', '🚒', '🚕', '🚚', '🚓', '🚛'];
            const lanePositions = [
                Math.floor(road.clientHeight * 0.05),
                Math.floor(road.clientHeight * 0.38),
                Math.floor(road.clientHeight * 0.70)
            ];

            function frameRender() {
                const roadWidth = road.clientWidth;
                const roadHeight = road.clientHeight;
                
                // [정밀 보정] 차 앞코 가로폭(75px)을 연산하여 횡단보도 직전(가로 110px 영역 왼쪽 보더라인)에 정확히 대기
                const stopLine = (roadWidth / 2) - 135; 

                for (let i = 0; i < cars.length; i++) {
                    let c = cars[i];
                    let carElement = document.getElementById(c.id);

                    if (currentLight === 'GREEN') {
                        c.currentSpeed = 0;
                    } else if (currentMode === 'AUTO' && currentLight === 'RED' && timeLeft <= 2) {
                        // 초록불 격하 2초 전 사전 감속 안전거리 확보 가이드라인 제어
                        if (c.x < stopLine && (c.x + c.targetSpeed) >= stopLine) {
                            c.x = stopLine;
                            c.currentSpeed = 0;
                        } else if (c.x === stopLine) {
                            c.currentSpeed = 0;
                        } else {
                            c.currentSpeed = c.targetSpeed;
                        }
                    } else {
                        let speedLimit = c.targetSpeed;
                        for (let j = 0; j < cars.length; j++) {
                            if (i !== j && cars[j].lane === c.lane) {
                                let frontCar = cars[j];
                                if (frontCar.x > c.x && (frontCar.x - c.x) < 120) {
                                    speedLimit = Math.min(speedLimit, frontCar.currentSpeed);
                                }
                            }
                        }
                        c.currentSpeed = speedLimit;
                    }

                    c.x += c.currentSpeed;

                    if (c.x > roadWidth + 30) {
                        c.x = -150 - (Math.random() * 100);
                        c.targetSpeed = 2.2 + Math.random() * 3.2;
                        c.lane = Math.floor(Math.random() * 3);
                        c.baseType = carEmojis[Math.floor(Math.random() * carEmojis.length)];
                        carElement.innerText = c.baseType;
                    }

                    carElement.style.left = c.x + 'px';
                    carElement.style.top = lanePositions[c.lane] + 'px';
                }

                if (ped.active) {
                    ped.y += ped.speed;
                    pedDiv.style.top = ped.y + 'px';
                    if (ped.y > roadHeight + 30) {
                        ped.active = false;
                        pedDiv.style.display = 'none';
                    }
                }

                globalAnimation = requestAnimationFrame(frameRender);
            }

            if(globalAnimation) cancelAnimationFrame(globalAnimation);
            frameRender();
        }
    </script>
</body>
</html>
