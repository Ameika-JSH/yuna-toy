<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2eddf">
    <title>바람개비</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            color: #242628;
            background: #f2eddf;
            font-synthesis: none;
            --ink: #242628;
            --paper: #f2eddf;
            --blue: #3547d4;
            --red: #ef5c3f;
            --lime: #d3ef59;
            --blade-1: #f2bf18;
            --blade-2: #f4d532;
            --blade-3: #f7a91b;
            --blade-4: #fff071;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 18px 20px 22px;
            background:
                radial-gradient(ellipse at 82% 18%, rgba(211, 239, 89, .6) 0 8%, transparent 8.2%),
                radial-gradient(ellipse at 10% 78%, rgba(239, 92, 63, .12) 0 12%, transparent 12.2%),
                var(--paper);
        }

        main { width: min(100%, 1100px); margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .eyebrow, .edition, .wheel-number, .micro-label {
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .13em;
            text-transform: uppercase;
        }
        .eyebrow { display: none; }
        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.7rem, 4vw, 2.7rem);
            font-weight: 500;
            letter-spacing: -.075em;
            line-height: 1;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 260px;
            gap: 14px;
        }

        .stage {
            position: relative;
            display: grid;
            height: min(74vh, 680px);
            min-height: 430px;
            overflow: hidden;
            place-items: center;
            border: 1px solid var(--ink);
            border-radius: 46% 46% 26px 26px / 30% 30% 26px 26px;
            background: #e4d8c3;
            isolation: isolate;
        }
        .stage::before {
            position: absolute;
            z-index: -1;
            top: 7%;
            left: 50%;
            width: min(82%, 500px);
            aspect-ratio: 1;
            border: 1px solid rgba(36, 38, 40, .16);
            border-radius: 50%;
            content: "";
            transform: translateX(-50%);
        }
        .stage::after {
            position: absolute;
            z-index: -1;
            right: 8%;
            bottom: 13%;
            width: 36px;
            height: 36px;
            border: 1px solid rgba(36, 38, 40, .55);
            border-radius: 50%;
            background: rgba(211, 239, 89, .78);
            content: "";
        }

        .pinwheel {
            position: absolute;
            top: 43%;
            left: 50%;
            z-index: 1;
            width: min(58vw, 430px);
            min-width: 230px;
            aspect-ratio: 1;
            perspective: 900px;
            transform: translate(-50%, -50%);
        }
        .pinwheel > svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
            transform-style: preserve-3d;
        }
        .wheel-design { display: none; }
        .wheel-design.is-active { display: block; }
        .wheel-hub {
            fill: var(--ink);
            stroke: var(--paper);
            stroke-width: 3;
        }
        .stage.vertical-axis .stem { display: none; }
        .stage.vertical-axis .wheel-hub,
        .stage.vertical-axis .pinwheel > svg > circle { display: none; }
        .hanger { display: none; }
        .stage.vertical-axis .hanger {
            position: absolute;
            top: 0;
            left: 50%;
            z-index: 1;
            display: block;
            width: 2px;
            height: 18%;
            background: var(--ink);
            transform: translateX(-50%);
        }
        .stage.vertical-axis .hanger::after {
            position: absolute;
            bottom: -7px;
            left: -4px;
            width: 10px;
            height: 10px;
            border: 1px solid var(--ink);
            border-radius: 50%;
            background: var(--blade-2);
            content: "";
        }

        .stem {
            position: absolute;
            top: 43%;
            left: 50%;
            z-index: 0;
            width: 8px;
            height: 49%;
            border: 1px solid var(--ink);
            border-radius: 8px;
            background: #f6f0df;
            transform: translateX(-50%);
        }
        .stem::after {
            position: absolute;
            right: -17px;
            bottom: -7px;
            left: -17px;
            height: 12px;
            border: 1px solid var(--ink);
            border-radius: 50%;
            background: var(--red);
            content: "";
        }

        .stage-caption {
            position: absolute;
            right: 18px;
            bottom: 14px;
            left: 18px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            color: #56564f;
            font-size: .66rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            clip-path: inset(50%);
        }

        .side-panel { display: flex; flex-direction: column; gap: 10px; }
        .paper-card {
            padding: 13px;
            border: 1px solid var(--ink);
            border-radius: 18px;
            background: #fbf8ef;
            box-shadow: 4px 4px 0 var(--ink);
        }
        .micro-label { display: none; }
        .wheel-picker { display: grid; grid-template-columns: 1fr; gap: 6px; }
        .wheel-choice {
            display: grid;
            grid-template-columns: 56px 1fr;
            align-items: center;
            gap: 12px;
            min-height: 76px;
            padding: 7px 12px;
            border: 1px solid #c8c2b4;
            border-radius: 12px;
            color: var(--ink);
            background: transparent;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }
        .wheel-choice:hover { border-color: var(--ink); }
        .wheel-choice[aria-pressed="true"] {
            border-color: var(--blue);
            background: #e9eaff;
            box-shadow: inset 4px 0 var(--blue);
        }
        .choice-icon { width: 54px; height: 54px; }
        .choice-icon svg { width: 100%; height: 100%; overflow: visible; }
        .choice-name { font-family: Georgia, "Times New Roman", serif; font-size: 1rem; }
        .wheel-number { display: none; }
        .color-picker {
            display: grid;
            grid-template-columns: auto repeat(4, 36px);
            align-items: center;
            justify-content: space-between;
            gap: 7px;
            margin-top: 10px;
        }
        .color-title { color: #56564f; font-size: .78rem; font-weight: 800; }
        .color-chip {
            position: relative;
            width: 34px;
            height: 34px;
            overflow: hidden;
            border: 2px solid #242628;
            border-radius: 50%;
            background: var(--chip-color);
            cursor: pointer;
        }
        .color-chip input {
            position: absolute;
            inset: -8px;
            width: 48px;
            height: 48px;
            padding: 0;
            border: 0;
            cursor: pointer;
            opacity: 0;
        }

        .sound-card { flex: 1; }
        .status {
            min-height: 1.2em;
            margin: 0 0 8px;
            color: #4e504b;
            font-size: .8rem;
            line-height: 1.2;
        }
        .start-button {
            width: 100%;
            min-height: 50px;
            border: 1px solid var(--ink);
            border-radius: 999px;
            color: #fff;
            background: var(--blue);
            box-shadow: 3px 3px 0 var(--ink);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }
        .start-button:hover { background: #2637c2; }
        .start-button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
        button:focus-visible, input:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
        button:disabled { cursor: wait; opacity: .7; }

        .meter-heading, .dead-zone-label {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 11px 0 6px;
            font-size: .78rem;
            font-weight: 800;
        }
        .meter {
            height: 14px;
            overflow: hidden;
            border: 1px solid var(--ink);
            border-radius: 99px;
            background: #dedacd;
        }
        .meter-level {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--lime), #ffbd52, var(--red));
            transition: width .08s linear;
        }
        .dead-zone-label { margin-top: 12px; }
        input[type="range"] { width: 100%; accent-color: var(--red); }
        .dead-zone-help, .edition { display: none; }

        @media (max-width: 680px) {
            body { padding: 14px 12px 18px; }
            header { margin-bottom: 8px; }
            .layout { grid-template-columns: 1fr; }
            .stage { height: min(56vh, 500px); min-height: 300px; }
            .pinwheel { top: 42%; width: min(69vw, 330px); min-width: 200px; }
            .stem { top: 43%; height: 49%; }
            .wheel-picker { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .wheel-choice { grid-template-columns: 1fr; justify-items: center; gap: 2px; min-height: 88px; padding: 7px 4px; }
            .choice-icon { width: 52px; height: 52px; }
            .choice-name { font-size: .88rem; }
            .color-picker { grid-template-columns: auto repeat(4, 34px); }
            .color-chip { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>바람개비</h1>
        </header>

        <section class="layout" aria-label="바람개비 게임">
            <div class="stage" aria-label="바람개비 무대">
                <div class="hanger" aria-hidden="true"></div>
                <div class="stem" aria-hidden="true"></div>
                <div class="pinwheel" id="pinwheel">
                    <svg id="wheelGraphic" viewBox="0 0 240 240" role="img" aria-label="선택한 바람개비">
                        <defs>
                            <linearGradient id="twistOne" x1="0" x2="1" y1="0" y2="1">
                                <stop offset="0" stop-color="var(--blade-1)"/>
                                <stop offset=".48" stop-color="var(--blade-2)"/>
                                <stop offset="1" stop-color="var(--blade-3)"/>
                            </linearGradient>
                            <linearGradient id="twistTwo" x1="0" x2="1" y1="0" y2="1">
                                <stop offset="0" stop-color="var(--blade-3)"/>
                                <stop offset=".52" stop-color="var(--blade-4)"/>
                                <stop offset="1" stop-color="var(--blade-1)"/>
                            </linearGradient>
                            <linearGradient id="twistThree" x1="0" x2="1" y1="0" y2="1">
                                <stop offset="0" stop-color="var(--blade-2)"/>
                                <stop offset=".5" stop-color="var(--blade-1)"/>
                                <stop offset="1" stop-color="var(--blade-4)"/>
                            </linearGradient>
                        </defs>
                        <g class="wheel-design is-active" data-wheel="paper">
                            <path d="M43 43H197V197H43Z" fill="#fbf8ef" fill-opacity=".12" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".55"/>
                            <g>
                                <path d="M120 120C96 94 56 60 43 43c35 7 70 27 77 69Z" fill="var(--blade-1)" stroke="var(--ink)" stroke-width="2"/>
                                <path d="M120 120 43 43c34 12 60 32 77 69Z" fill="#fff" opacity=".18"/>
                                <path d="M54 54c26 12 48 32 61 53" fill="none" stroke="#fff" stroke-width="2" opacity=".75"/>
                            </g>
                            <g transform="rotate(90 120 120)">
                                <path d="M120 120C96 94 56 60 43 43c35 7 70 27 77 69Z" fill="var(--blade-2)" stroke="var(--ink)" stroke-width="2"/>
                                <path d="M120 120 43 43c34 12 60 32 77 69Z" fill="#fff" opacity=".18"/>
                                <path d="M54 54c26 12 48 32 61 53" fill="none" stroke="#fff" stroke-width="2" opacity=".75"/>
                            </g>
                            <g transform="rotate(180 120 120)">
                                <path d="M120 120C96 94 56 60 43 43c35 7 70 27 77 69Z" fill="var(--blade-3)" stroke="var(--ink)" stroke-width="2"/>
                                <path d="M120 120 43 43c34 12 60 32 77 69Z" fill="#fff" opacity=".18"/>
                                <path d="M54 54c26 12 48 32 61 53" fill="none" stroke="#fff" stroke-width="2" opacity=".75"/>
                            </g>
                            <g transform="rotate(270 120 120)">
                                <path d="M120 120C96 94 56 60 43 43c35 7 70 27 77 69Z" fill="var(--blade-4)" stroke="var(--ink)" stroke-width="2"/>
                                <path d="M120 120 43 43c34 12 60 32 77 69Z" fill="#fff" opacity=".18"/>
                                <path d="M54 54c26 12 48 32 61 53" fill="none" stroke="#fff" stroke-width="2" opacity=".75"/>
                            </g>
                            <circle cx="120" cy="120" r="8" fill="#e4d8c3" stroke="var(--ink)" stroke-width="2"/>
                        </g>
                        <g class="wheel-design" data-wheel="propeller">
                            <g>
                                <path d="M115 113c-13-25-28-76-10-94 13-13 30-3 31 17 2 24-7 58-12 81Z" fill="var(--blade-1)" stroke="var(--ink)" stroke-width="3"/>
                                <path d="M117 102c-8-25-11-45-8-63" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
                            </g>
                            <g transform="rotate(120 120 120)">
                                <path d="M115 113c-13-25-28-76-10-94 13-13 30-3 31 17 2 24-7 58-12 81Z" fill="var(--blade-2)" stroke="var(--ink)" stroke-width="3"/>
                                <path d="M117 102c-8-25-11-45-8-63" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
                            </g>
                            <g transform="rotate(240 120 120)">
                                <path d="M115 113c-13-25-28-76-10-94 13-13 30-3 31 17 2 24-7 58-12 81Z" fill="var(--blade-3)" stroke="var(--ink)" stroke-width="3"/>
                                <path d="M117 102c-8-25-11-45-8-63" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
                            </g>
                        </g>
                        <g class="wheel-design" data-wheel="weird">
                            <path d="M120 19C76 30 55 48 64 69c7 18 39 23 54 41 13 16 6 36-22 52-31 18-38 37-14 54 9 7 24 11 38 14-13-16-13-27 4-39 24-17 49-31 50-54 1-22-21-35-43-48-20-12-29-24-11-40 16-14 28-21 0-30Z" fill="url(#twistOne)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
                            <path d="M120 19c25 17 38 35 25 54-13 18-43 26-51 46-9 23 14 42 36 57 25 17 32 37 8 54-9 6-20 9-32 12 12-15 12-27-4-39-21-16-45-31-46-53-1-21 21-35 43-49 21-13 28-25 11-40-14-13-24-21 10-42Z" fill="url(#twistTwo)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" opacity=".94"/>
                            <path d="M120 23c-16 20-17 37 1 52 21 18 39 30 38 49-1 22-22 33-39 47-18 15-20 28 0 47-33-10-44-27-31-48 12-18 37-28 39-48 2-17-17-28-36-42-21-15-24-34-4-54 8-8 19-16 32-23Z" fill="url(#twistThree)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" opacity=".78"/>
                            <path d="M119 28c-7 28 27 36 31 61 5 26-35 38-34 61 1 22 28 35 22 57" fill="none" stroke="#fff" stroke-width="4" opacity=".68" stroke-linecap="round"/>
                            <path d="M120 10v220" fill="none" stroke="var(--ink)" stroke-width="3"/>
                            <path d="M120 10v220" fill="none" stroke="#fff" stroke-width="1" opacity=".6"/>
                            <circle cx="120" cy="17" r="7" fill="var(--blade-2)" stroke="var(--ink)" stroke-width="2"/>
                        </g>
                        <circle class="wheel-hub" cx="120" cy="120" r="10"/>
                        <circle cx="120" cy="120" r="3.5" fill="#f2eddf"/>
                    </svg>
                </div>
                <div class="stage-caption">
                    <span id="wheelCaption">색종이</span>
                    <span id="spinCaption">대기</span>
                </div>
            </div>

            <aside class="side-panel">
                <section class="paper-card" aria-label="바람개비 모양 선택">
                    <div class="wheel-picker">
                        <button class="wheel-choice" type="button" data-choice="paper" aria-label="색종이 바람개비" aria-pressed="true">
                            <span class="choice-icon" aria-hidden="true">
                                <svg viewBox="0 0 60 60">
                                    <path d="M30 30C23 21 12 11 8 7c12 2 22 9 23 22Z" fill="var(--blade-1)" stroke="#242628" stroke-width="1.5"/>
                                    <path d="M30 30C39 23 49 12 53 8c-2 12-9 22-22 23Z" fill="var(--blade-2)" stroke="#242628" stroke-width="1.5"/>
                                    <path d="M30 30C37 39 48 49 52 53c-12-2-22-9-23-22Z" fill="var(--blade-3)" stroke="#242628" stroke-width="1.5"/>
                                    <path d="M30 30C21 37 11 48 7 52c2-12 9-22 22-23Z" fill="var(--blade-4)" stroke="#242628" stroke-width="1.5"/>
                                    <circle cx="30" cy="30" r="3" fill="#f2eddf" stroke="#242628" stroke-width="1.5"/>
                                </svg>
                            </span>
                            <span class="choice-name">색종이</span>
                        </button>
                        <button class="wheel-choice" type="button" data-choice="propeller" aria-label="프로펠러 바람개비" aria-pressed="false">
                            <span class="choice-icon" aria-hidden="true">
                                <svg viewBox="0 0 60 60">
                                    <path d="M28 28C20 15 21 4 29 4c9 0 8 12 4 25Z" fill="var(--blade-1)" stroke="#242628" stroke-width="1.5"/>
                                    <path d="M28 28C20 15 21 4 29 4c9 0 8 12 4 25Z" fill="var(--blade-2)" stroke="#242628" stroke-width="1.5" transform="rotate(120 30 30)"/>
                                    <path d="M28 28C20 15 21 4 29 4c9 0 8 12 4 25Z" fill="var(--blade-3)" stroke="#242628" stroke-width="1.5" transform="rotate(240 30 30)"/>
                                    <circle cx="30" cy="30" r="3.5" fill="#f2eddf" stroke="#242628" stroke-width="1.5"/>
                                </svg>
                            </span>
                            <span class="choice-name">프로펠러</span>
                        </button>
                        <button class="wheel-choice" type="button" data-choice="weird" aria-label="세로축 나선 바람개비" aria-pressed="false">
                            <span class="choice-icon" aria-hidden="true">
                                <svg viewBox="0 0 60 60">
                                    <path d="M30 3C18 9 16 15 27 21c13 7 15 13 3 20-12 7-13 13 0 16-6-7-4-10 4-15 12-7 10-13-1-20-9-6-10-11-3-19Z" fill="var(--blade-1)" stroke="#242628" stroke-width="1.4"/>
                                    <path d="M30 3c8 7 10 12 3 19-9 8-10 14 1 21 9 6 8 11-4 14 6-7 4-10-4-15-12-7-10-13 1-20 9-6 10-11 3-19Z" fill="var(--blade-3)" stroke="#242628" stroke-width="1.4"/>
                                    <path d="M30 5v50" fill="none" stroke="#fff" stroke-width="1" opacity=".8"/>
                                    <circle cx="30" cy="4" r="2.5" fill="var(--blade-2)" stroke="#242628" stroke-width="1"/>
                                </svg>
                            </span>
                            <span class="choice-name">세로 나선</span>
                        </button>
                    </div>
                    <div class="color-picker" aria-label="바람개비 색상">
                        <span class="color-title">색상</span>
                        <label class="color-chip" style="--chip-color:var(--blade-1)">
                            <input type="color" value="#f2bf18" data-blade-color="1" aria-label="첫 번째 날개 색상">
                        </label>
                        <label class="color-chip" style="--chip-color:var(--blade-2)">
                            <input type="color" value="#f4d532" data-blade-color="2" aria-label="두 번째 날개 색상">
                        </label>
                        <label class="color-chip" style="--chip-color:var(--blade-3)">
                            <input type="color" value="#f7a91b" data-blade-color="3" aria-label="세 번째 날개 색상">
                        </label>
                        <label class="color-chip" style="--chip-color:var(--blade-4)">
                            <input type="color" value="#fff071" data-blade-color="4" aria-label="네 번째 날개 색상">
                        </label>
                    </div>
                </section>

                <section class="paper-card sound-card" aria-label="마이크 설정">
                    <p class="status" id="status" role="status" aria-live="polite">대기</p>
                    <button class="start-button" id="toggleButton" type="button">🎙 시작</button>

                    <div class="meter-heading">
                        <span class="sr-only">마이크 입력</span>
                        <span id="levelText">0%</span>
                    </div>
                    <div class="meter" role="meter" aria-label="마이크 소리 크기" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div class="meter-level" id="meterLevel"></div>
                    </div>

                    <label class="dead-zone-label" for="deadZone">
                        <span>데드존</span>
                        <span id="deadZoneText">8%</span>
                    </label>
                    <input id="deadZone" type="range" min="0" max="30" value="8">
                </section>
            </aside>
        </section>
    </main>

    <script>
        const toggleButton = document.getElementById("toggleButton");
        const statusText = document.getElementById("status");
        const meter = document.querySelector(".meter");
        const meterLevel = document.getElementById("meterLevel");
        const levelText = document.getElementById("levelText");
        const deadZone = document.getElementById("deadZone");
        const deadZoneText = document.getElementById("deadZoneText");
        const wheelGraphic = document.getElementById("wheelGraphic");
        const stage = document.querySelector(".stage");
        const spinCaption = document.getElementById("spinCaption");
        const wheelCaption = document.getElementById("wheelCaption");
        const samples = new Uint8Array(1024);
        const wheelNames = { paper: "색종이", propeller: "프로펠러", weird: "세로 나선" };

        let audioContext;
        let analyser;
        let microphone;
        let stream;
        let animationFrame;
        let lastFrame = 0;
        let angle = 0;
        let spinSpeed = 0;
        let windWasDetected = false;
        let selectedWheel = "paper";

        document.querySelectorAll(".wheel-choice").forEach(button => {
            button.addEventListener("click", () => selectWheel(button.dataset.choice));
        });

        function selectWheel(wheel) {
            selectedWheel = wheel;
            stage.classList.toggle("vertical-axis", wheel === "weird");
            document.querySelectorAll(".wheel-choice").forEach(button => {
                button.setAttribute("aria-pressed", String(button.dataset.choice === wheel));
            });
            document.querySelectorAll(".wheel-design").forEach(design => {
                design.classList.toggle("is-active", design.dataset.wheel === wheel);
            });
            wheelCaption.textContent = wheelNames[wheel];
            updateWheelRotation();
        }

        function updateWheelRotation() {
            const rotation = selectedWheel === "weird"
                ? "rotateY(" + angle + "deg)"
                : "rotateZ(" + angle + "deg)";
            wheelGraphic.style.transform = rotation;
        }

        function setWindStatus(isDetected) {
            if (isDetected === windWasDetected) return;
            windWasDetected = isDetected;
            statusText.textContent = isDetected ? "바람!" : "대기";
        }

        function stopMicrophone() {
            cancelAnimationFrame(animationFrame);
            if (stream) stream.getTracks().forEach(track => track.stop());
            if (audioContext && audioContext.state !== "closed") audioContext.close();
            stream = undefined;
            audioContext = undefined;
            analyser = undefined;
            microphone = undefined;
            spinSpeed = 0;
            windWasDetected = false;
            updateWheelRotation();
            spinCaption.textContent = "멈춤";
            meterLevel.style.width = "0%";
            levelText.textContent = "0%";
            meter.setAttribute("aria-valuenow", "0");
            toggleButton.textContent = "🎙 다시 시작";
        }

        function readVolume() {
            analyser.getByteTimeDomainData(samples);
            let sum = 0;
            for (const sample of samples) {
                const normalized = (sample - 128) / 128;
                sum += normalized * normalized;
            }
            return Math.sqrt(sum / samples.length);
        }

        function animate(timestamp) {
            if (!analyser) return;
            const delta = lastFrame ? Math.min((timestamp - lastFrame) / 1000, 0.05) : 0;
            lastFrame = timestamp;

            const level = Math.min(100, Math.round(readVolume() * 350));
            const deadZoneValue = Number(deadZone.value);
            const wind = level > deadZoneValue
                ? (level - deadZoneValue) / (100 - deadZoneValue)
                : 0;
            const hasWind = wind > 0;

            meterLevel.style.width = level + "%";
            levelText.textContent = level + "%";
            meter.setAttribute("aria-valuenow", String(level));
            setWindStatus(hasWind);

            if (hasWind) {
                spinSpeed = Math.min(7, spinSpeed + wind * 15 * delta);
            } else {
                spinSpeed = Math.max(0, spinSpeed - 9 * delta);
            }

            angle = (angle + spinSpeed * 360 * delta) % 360;
            updateWheelRotation();
            spinCaption.textContent = spinSpeed < .1 ? "멈춤" : spinSpeed < 2.5 ? "느림" : spinSpeed < 5 ? "회전" : "빠름";
            animationFrame = requestAnimationFrame(animate);
        }

        async function startMicrophone() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error("이 브라우저에서는 마이크를 사용할 수 없어요. HTTPS 또는 localhost에서 열어 주세요.");
            }
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            await audioContext.resume();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 1024;
            microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);
            lastFrame = 0;
            windWasDetected = false;
            statusText.textContent = "준비";
            toggleButton.textContent = "⏹ 중지";
            animationFrame = requestAnimationFrame(animate);
        }

        toggleButton.addEventListener("click", async () => {
            if (stream) {
                stopMicrophone();
                statusText.textContent = "대기";
                return;
            }

            toggleButton.disabled = true;
            statusText.textContent = "연결 중";
            try {
                await startMicrophone();
            } catch (error) {
                stopMicrophone();
                statusText.textContent = error.name === "NotAllowedError"
                    ? "마이크 권한 필요"
                    : error.message || "연결 실패";
            } finally {
                toggleButton.disabled = false;
            }
        });

        deadZone.addEventListener("input", () => {
            deadZoneText.textContent = deadZone.value + "%";
        });

        document.querySelectorAll("[data-blade-color]").forEach(input => {
            input.addEventListener("input", () => {
                document.documentElement.style.setProperty("--blade-" + input.dataset.bladeColor, input.value);
                input.parentElement.style.setProperty("--chip-color", input.value);
            });
        });
    </script>
</body>
</html>
