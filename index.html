<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff8e9">
    <title>유나의 게임방</title>
    <style>
        :root {
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            color: #29364b;
            background: #fff8e9;
            font-synthesis: none;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            background:
                radial-gradient(circle at 12% 20%, #ffe1cc 0 5px, transparent 6px),
                radial-gradient(circle at 88% 26%, #d7edff 0 7px, transparent 8px),
                #fff8e9;
        }

        main {
            width: min(100%, 900px);
            margin: 0 auto;
        }

        header { margin-bottom: 32px; text-align: center; }
        .eyebrow {
            margin: 0 0 8px;
            color: #e78353;
            font-size: .82rem;
            font-weight: 800;
            letter-spacing: .14em;
        }
        h1 {
            margin: 0;
            color: #27344a;
            font-size: clamp(2rem, 7vw, 3.3rem);
            letter-spacing: -.07em;
        }
        header p:last-child {
            margin: 12px 0 0;
            color: #718096;
            font-size: 1rem;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .game-card {
            --accent: #f29a61;
            --tint: #fff0e3;
            display: flex;
            min-height: 275px;
            flex-direction: column;
            align-items: flex-start;
            padding: 24px;
            border: 2px solid rgba(67, 76, 96, .07);
            border-radius: 26px;
            background: #fff;
            box-shadow: 0 12px 30px rgba(77, 82, 102, .08);
            color: inherit;
            text-decoration: none;
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .game-card:nth-child(2) { --accent: #43a879; --tint: #e6f7ed; }
        .game-card:nth-child(3) { --accent: #3547d4; --tint: #e9eaff; }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 34px rgba(77, 82, 102, .14);
        }
        .game-card:focus-visible {
            outline: 4px solid #347fa6;
            outline-offset: 4px;
        }

        .icon {
            display: grid;
            width: 82px;
            height: 82px;
            place-items: center;
            margin-bottom: 20px;
            border-radius: 24px;
            background: var(--tint);
            font-size: 3rem;
        }
        .folder {
            margin: 0 0 6px;
            color: var(--accent);
            font-size: .75rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        h2 {
            margin: 0;
            font-size: 1.55rem;
            letter-spacing: -.05em;
        }
        .description {
            margin: 8px 0 22px;
            color: #718096;
            line-height: 1.55;
        }
        .play {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: auto;
            color: var(--accent);
            font-weight: 800;
        }

        footer {
            margin-top: 28px;
            color: #8993a2;
            font-size: .82rem;
            text-align: center;
        }

        @media (max-width: 600px) {
            body { padding: 34px 16px; }
            .games { grid-template-columns: 1fr; gap: 14px; }
            .game-card { min-height: 230px; padding: 22px; }
            .icon { width: 68px; height: 68px; font-size: 2.5rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <p class="eyebrow">YUNA'S PLAYROOM</p>
            <h1>유나의 게임방 🎈</h1>
            <p>하고 싶은 놀이를 골라 보세요!</p>
        </header>

        <section class="games" aria-label="게임 목록">
            <a class="game-card" href="./mk_traffic/index.html">
                <span class="icon" aria-hidden="true">🚦</span>
                <p class="folder">MK_TRAFFIC</p>
                <h2>신호등 놀이</h2>
                <p class="description">신호등을 보고 재미있게 놀이해요.</p>
                <span class="play">게임 시작하기 <span aria-hidden="true">→</span></span>
            </a>

            <a class="game-card" href="./helicopter/index.html">
                <span class="icon" aria-hidden="true">🚁</span>
                <p class="folder">HELICOPTER</p>
                <h2>소리로 날리는 헬기</h2>
                <p class="description">마이크에 소리를 내서 헬기를 하늘 높이 날려 봐요.</p>
                <span class="play">게임 시작하기 <span aria-hidden="true">→</span></span>
            </a>

            <a class="game-card" href="./pinwheel/index.html">
                <span class="icon" aria-hidden="true">🌀</span>
                <p class="folder">PINWHEEL</p>
                <h2>바람개비 실험실</h2>
                <p class="description">마이크에 바람을 불어 바람개비를 빙글빙글 돌려 봐요.</p>
                <span class="play">게임 시작하기 <span aria-hidden="true">→</span></span>
            </a>
        </section>

        <footer>유나를 위한 작은 게임 모음</footer>
    </main>
</body>
</html>
